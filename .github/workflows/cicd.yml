# Canonical caller — every knob lives in /hanzo.yml, none here.
name: CI/CD
on:
  push:
    branches: [unstable]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
